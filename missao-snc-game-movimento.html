#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:10px;z-index:5}
.card{background:rgba(5,18,34,.86);border:2px solid #fff8;border-radius:15px;padding:8px 12px;box-shadow:0 5px 18px #0008}
#hero{position:absolute;left:8%;bottom:16%;width:58px;height:90px;z-index:4;transition:filter .15s}
.head{position:absolute;left:14px;top:0;width:32px;height:32px;border-radius:50%;background:#6d3b23;border:4px solid #191919}
.hair{position:absolute;left:7px;top:-6px;width:45px;height:25px;border-radius:50%;background:#17100d;box-shadow:-7px 5px 0 #17100d,7px 4px 0 #17100d}
.body{position:absolute;left:10px;top:29px;width:39px;height:43px;border-radius:10px;background:#182536;border:4px solid #111}
.leg{position:absolute;top:68px;width:13px;height:22px;background:#24517a;border:3px solid #111;border-radius:4px}.l1{left:12px}.l2{left:34px}

.coin{position:absolute;width:30px;height:30px;border-radius:50%;background:#ffd52d;border:3px solid #fff3a0;color:#473300;font-weight:900;text-align:center;line-height:24px;z-index:3;animation:spin 1s infinite alternate}
@keyframes spin{to{transform:scaleX(.55) translateY(-5px)}}

button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}
.yellow{background:#ffd632;color:#151515}.dark{background:#17273d;color:#fff;border:1px solid #fff6}
#controls{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;z-index:7}
.ctrl{width:62px;height:62px;border-radius:50%;background:#07182dcc;color:#fff;border:2px solid #fff9;font-size:24px}
#rightControls{position:absolute;right:12px;bottom:12px;display:flex;gap:8px;z-index:7}
#toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:clamp(20px,4vw,42px);font-weight:1000;text-shadow:0 4px 12px #000;display:none;z-index:10;text-align:center}
#sound{cursor:pointer}

</style></head>
<body><div id="game"><div id="shade"></div>
<div id="hud"><div class="card">❤️❤️❤️❤️ <b>NERI</b><br>⭐ <span id="score">0</span> &nbsp; 🏅 <span id="badge">0</span></div>
<div class="card">🌆 MUNDO 1 — TERRITÓRIO<br><small>Missão: chegar à Creche Eloá</small></div>
<div class="card" id="sound">🎵 SOM: OFF</div></div>
<div id="hero"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="leg l1"></div><div class="leg l2"></div></div>
<div id="eloa">🏠</div>
<div class="coin" style="left:31%;bottom:23%">★</div><div class="coin" style="left:49%;bottom:29%">★</div><div class="coin" style="left:64%;bottom:20%">★</div>
<div id="msg" class="card"><b>ADRI — Diretora da Creche Eloá</b><br><span id="dialog">Seja bem-vindo à Creche Eloá! Aqui cuidado, educação, cultura e território caminham juntos.</span>
<div class="actions"><button class="yellow" id="talk">Conhecer as boas práticas</button><button class="dark" id="close">Continuar explorando</button></div></div>
<div id="toast"></div>
<div id="controls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
<div id="rightControls"><button class="ctrl" id="jump">⬆</button><button class="ctrl" id="interact">A</button></div>
</div>
<script>
const hero=document.querySelector('#hero'),game=document.querySelector('#game'),msg=document.querySelector('#msg'),toast=document.querySelector('#toast');
let x=8,y=0,vy=0,ground=0,score=0,near=false,moving=0,audio=null,melody=null;
const coins=[...document.querySelectorAll('.coin')];
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function draw(){x=clamp(x,2,90);hero.style.left=x+'%';hero.style.bottom=(16+y)+'%';hero.classList.toggle('run',moving!==0);near=x>67; coins.forEach(c=>{if(c.dataset.got)return;let cx=parseFloat(c.style.left);if(Math.abs(x-cx)<4&&y<12){c.dataset.got=1;c.style.display='none';score+=100;document.querySelector('#score').textContent=score;pop('+100 ⭐')}})}
function step(){if(moving)x+=moving*.32;if(y>0||vy>0){y+=vy;vy-=.45;if(y<=0){y=0;vy=0}}draw();requestAnimationFrame(step)}step();
function pop(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1200)}
function jump(){if(y===0){vy=4.8;beep(520,.08)}}
function interact(){if(near){msg.style.display='block';beep(660,.1)}else pop('Chegue mais perto da Creche Eloá 🏠')}
function hold(el,dir){el.onpointerdown=()=>moving=dir;el.onpointerup=el.onpointerleave=()=>moving=0}
hold(document.querySelector('#left'),-1);hold(document.querySelector('#right'),1);
document.querySelector('#jump').onclick=jump;document.querySelector('#interact').onclick=interact;
document.querySelector('#close').onclick=()=>msg.style.display='none';
document.querySelector('#talk').onclick=()=>{score+=500;document.querySelector('#score').textContent=score;document.querySelector('#badge').textContent=1;document.querySelector('#dialog').innerHTML='🏅 <b>SALVO-CONDUTO DAS BOAS PRÁTICAS!</b><br>Você conheceu a experiência da Creche Eloá. +500 pontos, +1 vida e Insígnia “Cuidado e Território”. Este local agora é seu checkpoint.';document.querySelector('#talk').style.display='none';pop('🏅 CHECKPOINT CONQUISTADO!');beep(880,.25)}
document.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='a')moving=-1;if(e.key==='ArrowRight'||e.key==='d')moving=1;if(e.key==='ArrowUp'||e.key===' ' )jump();if(e.key==='Enter')interact()}
document.onkeyup=e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))moving=0}
function beep(f,d){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.05;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}
document.querySelector('#sound').onclick=()=>{if(!audio){audio=new (AudioContext||webkitAudioContext)();document.querySelector('#sound').textContent='🎵 SOM: ON';let notes=[220,277,330,392,330,277];let i=0;melody=setInterval(()=>beep(notes[i++%notes.length],.18),420)}else{clearInterval(melody);audio.close();audio=null;document.querySelector('#sound').textContent='🎵 SOM: OFF'}}
</script></body></html>
