<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Missão SNC — Mundo 1</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#071522;font-family:Arial;color:#fff}canvas{display:block;width:100vw;height:100vh;touch-action:none}.hud{position:fixed;top:10px;background:#071522dd;border:2px solid #29c9ff;border-radius:14px;padding:8px 12px}.m{left:10px;max-width:430px}.s{right:10px;font-weight:900}.ttl{color:#ffd83d;font-weight:900}.ctrl{position:fixed;left:16px;right:16px;bottom:18px;display:flex;justify-content:space-between;pointer-events:none}.grp{display:flex;gap:10px;pointer-events:auto}.b{width:68px;height:68px;border-radius:50%;border:2px solid #fff;background:#0a1a2ddd;color:#fff;font-size:27px;font-weight:900;touch-action:none}.a{border-color:#ffd83d}.j{border-color:#63ff78}#dlg{position:fixed;left:50%;bottom:102px;transform:translateX(-50%);width:min(760px,86vw);background:#061322f2;border:2px solid #29c9ff;border-radius:15px;padding:13px 16px;display:none}#dlg b{color:#ffd83d;font-size:18px}#toast{position:fixed;top:88px;left:50%;transform:translateX(-50%);background:#111e;border:2px solid #ffd83d;border-radius:99px;padding:9px 16px;font-weight:900;display:none}@media(max-width:650px){.m{max-width:55vw;font-size:11px}.s{font-size:12px}.b{width:60px;height:60px}}</style></head><body><canvas id="g"></canvas><div class="hud m"><div class="ttl">MISSÃO SNC — MUNDO 1: TERRITÓRIO</div><div id="obj">Explore o território e chegue à Creche Eloá.</div><small>⭐ memórias • 💬 encontros • 🏫 checkpoint</small></div><div class="hud s">❤️ 3 &nbsp; ⭐ <span id="score">0</span> &nbsp; 🏅 <span id="badge">—</span></div><div id="toast"></div><div id="dlg"><b id="sp"></b><div id="tx"></div></div><div class="ctrl"><div class="grp"><button class="b" id="L">◀</button><button class="b" id="R">▶</button></div><div class="grp"><button class="b j" id="J">↑</button><button class="b a" id="A">A</button></div></div><script>
const C=document.getElementById('g'),X=C.getContext('2d');let W,H,D=1,cam=0,t=0,score=0,adri=0,carla=0,pass=0,won=0;const P={x:180,y:0,vx:0,vy:0,on:1,dir:1,run:0},K={l:0,r:0};const G=()=>H-105;const stars=[620,940,1260,1620,1980,2340,2700,3060,3440,3820].map((x,i)=>({x,y:i%2?170:110,t:0}));const people=[{x:1080,n:'Morador'},{x:2140,n:'Agente cultural'},{x:3260,n:'Adri'},{x:3450,n:'Carla'}];function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}onresize=resize;resize();
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.q);toast.q=setTimeout(()=>e.style.display='none',1500)}function dlg(n,s){sp.textContent=n;tx.textContent=s;document.getElementById('dlg').style.display='block'}function close(){document.getElementById('dlg').style.display='none'}function add(n){score+=n;document.getElementById('score').textContent=score}function near(q,d=130){return Math.abs(P.x-q)<d}function jump(){if(P.on){P.vy=-650;P.on=0}}function act(){close();if(near(3260)){if(!adri)add(150);adri=1;dlg('ADRI — CRECHE ELOÁ','Bem-vindo, Neri. Aqui cuidado, educação, cultura e território caminham juntos. Converse com Carla.');obj.textContent='Converse com Carla para completar a missão.';return}if(near(3450)&&adri&&!carla){carla=1;pass=1;add(350);badge.textContent='Cuidado e Território';obj.textContent='Salvo-Conduto conquistado! Siga ao Portal da Participação.';dlg('CARLA','Boas práticas nascem da escuta, do cuidado e da participação da comunidade. Leve esse aprendizado adiante.');toast('🏅 +500 • SALVO-CONDUTO');return}if(near(1080)){dlg('MORADOR','O território também é memória. Observe quem vive aqui, os espaços e as histórias.');return}if(near(2140)){dlg('AGENTE CULTURAL','Política cultural começa ouvindo as pessoas e reconhecendo o que já existe no território.');return}if(near(4700)&&pass&&!won){won=1;add(500);dlg('MISSÃO CONCLUÍDA','Mundo 1 concluído! Próximo: Participação e Conferência.');toast('🎉 MUNDO 1 CONCLUÍDO');return}toast('Chegue perto de uma pessoa ou local para interagir.')}
function bind(id,k){let e=document.getElementById(id);e.onpointerdown=q=>{q.preventDefault();k==='j'?jump():k==='a'?act():K[k]=1};e.onpointerup=e.onpointercancel=()=>{if(k==='l'||k==='r')K[k]=0}}bind('L','l');bind('R','r');bind('J','j');bind('A','a');onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='a')K.l=1;if(e.key==='ArrowRight'||e.key==='d')K.r=1;if(['ArrowUp','w',' '].includes(e.key))jump();if(e.key==='Enter'||e.key==='e')act()};onkeyup=e=>{if(e.key==='ArrowLeft'||e.key==='a')K.l=0;if(e.key==='ArrowRight'||e.key==='d')K.r=0};
function upd(dt){t+=dt;let a=K.r?1:K.l?-1:0;if(a){P.vx+=a*1450*dt;P.dir=a;P.run+=dt*12}else P.vx*=Math.pow(.001,dt);P.vx=Math.max(-330,Math.min(330,P.vx));P.x=Math.max(30,Math.min(5170,P.x+P.vx*dt));P.vy+=1600*dt;P.y+=P.vy*dt;if(P.y>=0){P.y=0;P.vy=0;P.on=1}stars.forEach(s=>{if(!s.t&&Math.abs(P.x-s.x)<45){s.t=1;add(25);toast('⭐ MEMÓRIA +25')}});cam+=(P.x-W*.38-cam)*Math.min(1,dt*5);cam=Math.max(0,Math.min(5200-W,cam))}
function bg(){let q=X.createLinearGradient(0,0,0,H);q.addColorStop(0,'#159ee9');q.addColorStop(.55,'#8ee4ff');q.addColorStop(1,'#ffd27d');X.fillStyle=q;X.fillRect(0,0,W,H);X.fillStyle='#6d7d93';for(let i=0;i<18;i++){let z=i*170-(cam*.12%170),h=70+(i*37%120);X.fillRect(z,H-280-h,110,h)}X.fillStyle='#2f8b55';X.beginPath();X.moveTo(0,H-210);for(let i=0;i<=W;i+=90)X.lineTo(i,H-220-Math.sin((i+cam*.2)/180)*55);X.lineTo(W,H);X.lineTo(0,H);X.fill()}
function bld(wx,w,h,c,l){let z=wx-cam;if(z<-w||z>W)return;X.fillStyle=c;X.fillRect(z,G()-h,w,h);X.fillStyle='#f8d27a';for(let yy=G()-h+35;yy<G()-30;yy+=55)for(let xx=z+20;xx<z+w-20;xx+=65)X.fillRect(xx,yy,28,26);X.fillStyle='#0b1b2d';X.font='900 17px Arial';X.textAlign='center';X.fillText(l,z+w/2,G()-h+24)}function scene(){X.fillStyle='#d7a665';X.fillRect(0,G(),W,H-G());bld(400,500,210,'#e76945','VILA SUÍÇA');bld(1350,520,250,'#efb447','BIBLIOTECA VIVA');bld(2450,500,235,'#50a0a8','CESA CATA PRETA');bld(3050,720,300,'#f27c55','CRECHE ELOÁ');bld(4100,620,260,'#58a95f','PARQUE / TERRITÓRIO');let z=3250-cam;X.fillStyle='#ffd83d';X.fillRect(z,G()-370,6,80);X.beginPath();X.moveTo(z+6,G()-370);X.lineTo(z+80,G()-345);X.lineTo(z+6,G()-320);X.fill();z=4700-cam;X.strokeStyle=pass?'#6cff78':'#888';X.lineWidth=10;X.beginPath();X.arc(z,G()-95,72,Math.PI,0);X.stroke();X.fillStyle='#102030';X.font='900 16px Arial';X.fillText('PORTAL DA PARTICIPAÇÃO',z,G()-115)}
function star(s){if(s.t)return;let z=s.x-cam,y=G()-s.y+Math.sin(t*4+s.x)*8;X.save();X.translate(z,y);X.rotate(t);X.fillStyle='#ffd83d';X.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?8:18;X.lineTo(Math.cos(a)*r,Math.sin(a)*r)}X.closePath();X.fill();X.restore()}function person(o){let z=o.x-cam;X.fillStyle=o.n==='Adri'?'#7a2f8f':o.n==='Carla'?'#e07332':'#283d68';X.beginPath();X.arc(z,G()-92,18,0,7);X.fill();X.fillRect(z-16,G()-74,32,55);X.fillStyle='#fff';X.font='bold 13px Arial';X.textAlign='center';X.fillText(o.n,z,G()-120);if(near(o.x,115)){X.fillStyle='#ffd83d';X.font='900 22px Arial';X.fillText('A',z,G()-145)}}
function neri(){let z=P.x-cam,y=G()+P.y,w=Math.sin(P.run)*9;X.save();X.translate(z,y);if(P.dir<0)X.scale(-1,1);X.fillStyle='#0005';X.beginPath();X.ellipse(0,4,30,8,0,0,7);X.fill();X.strokeStyle='#17334d';X.lineWidth=12;X.lineCap='round';X.beginPath();X.moveTo(-8,-45);X.lineTo(-10+w,-8);X.moveTo(8,-45);X.lineTo(10-w,-8);X.stroke();X.strokeStyle='#9b5d28';X.lineWidth=10;X.beginPath();X.moveTo(-10+w,-7);X.lineTo(-2+w,-5);X.moveTo(10-w,-7);X.lineTo(18-w,-5);X.stroke();X.fillStyle='#111';X.fillRect(-23,-103,46,62);X.fillStyle='#fff';X.font='900 9px Arial';X.textAlign='center';X.fillText('SARAU',0,-78);X.fillText('NA QUEBRADA',0,-67);X.fillStyle='#8b572a';X.fillRect(-30,-96,12,44);X.fillStyle='#7b452e';X.beginPath();X.arc(0,-120,18,0,7);X.fill();X.fillStyle='#19100c';X.beginPath();X.arc(7,-116,12,0,Math.PI);X.fill();X.fillStyle='#b87835';X.fillRect(-25,-143,50,6);X.beginPath();X.ellipse(0,-146,19,9,0,0,7);X.fill();X.restore()}function dog(){let z=P.x-65*P.dir-cam,y=G()+P.y;X.fillStyle='#b87333';X.beginPath();X.ellipse(z,y-23,28,18,0,0,7);X.fill();X.beginPath();X.arc(z+23*P.dir,y-35,13,0,7);X.fill()}
function draw(){bg();scene();stars.forEach(star);people.forEach(person);dog();neri();X.fillStyle='#071522dd';X.fillRect(0,H-27,W,27);X.fillStyle='#ffd83d';X.font='900 12px Arial';X.textAlign='center';X.fillText('TERRITÓRIO → CRECHE ELOÁ → PARTICIPAÇÃO → CONFERÊNCIA → CONSELHO → PLANO',W/2,H-9)}let last=performance.now();function loop(n){let dt=Math.min(.033,(n-last)/1000);last=n;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);toast('🎮 Use ◀ ▶, pule e pressione A para interagir');
</script></body></html>
